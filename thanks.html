<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Paws</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EDF0F3; --card:#FFFFFF; --ink:#11151A; --slate:#5C6773;
  --hair:#D3DAE1; --hold:#1F6B5C; --hold-soft:#E4F0ED;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:clamp(20px,5vw,56px);
}
.wrap{max-width:560px;width:100%}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2;letter-spacing:-.03em;font-weight:800;margin:14px 0 0;word-break:keep-all}
.lede{margin:14px 0 0;color:var(--slate);word-break:keep-all}
.steps{margin:28px 0 0;background:var(--card);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:16px;border-bottom:1px solid var(--hair);align-items:start}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--mono);font-size:12px;color:var(--slate);padding-top:3px}
.step p{margin:0;word-break:keep-all}
.note{margin-top:22px;padding:14px 16px;background:var(--hold-soft);border-radius:10px;color:var(--hold);font-size:14px;word-break:keep-all}
.foot{margin-top:26px;font-size:13px;color:var(--slate);display:flex;flex-wrap:wrap;gap:6px 16px}
.foot a{color:var(--slate)}
a:focus-visible{outline:2px solid var(--hold);outline-offset:3px;border-radius:6px}
@media (prefers-color-scheme: dark){
  :root{--paper:#12171D;--card:#181E25;--ink:#EEF2F6;--slate:#95A1AE;--hair:#28313A;--hold:#7FC7B5;--hold-soft:#14231F}
}
</style>
</head>
<body data-root="">
<div class="wrap">
  <div class="eyebrow" id="eyebrow">DOWNLOADING</div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>

  <div class="steps">
    <div class="step"><div class="n">01</div><p id="s1"></p></div>
    <div class="step"><div class="n">02</div><p id="s2"></p></div>
    <div class="step"><div class="n">03</div><p id="s3"></p></div>
  </div>

  <p class="note" id="note"></p>

  <div class="foot">
    <a id="again" href="Paws-1.3.4.dmg" data-direct></a>
    <a href="mailto:pawsapp.help@gmail.com" id="help"></a>
    <a id="back" href="./"></a>
  </div>
</div>

<script>
/* 한 파일로 다섯 언어를 본다. 감사 페이지는 검색에 걸릴 이유가 없어서(noindex)
   언어마다 주소를 따로 둘 이유도 없다. */
(function () {
  var T = {
    ko: {
      eyebrow: "내려받는 중", title: "받으셨습니다",
      lede: "내려받기가 곧 시작됩니다. 시작되지 않으면 아래 링크를 누르세요.",
      s1: "받은 DMG 를 열고 Paws 를 응용 프로그램 폴더로 끌어다 놓습니다.",
      s2: "응용 프로그램에서 Paws 를 엽니다. 메뉴바에 발바닥이 하나 생깁니다 — 창은 뜨지 않습니다.",
      s3: "알림을 허용하면 메모리가 위험해질 때만 말을 겁니다. 평소에는 조용합니다.",
      note: "설치 후 14일 동안 전부 열립니다. 그 뒤에도 감시·그래프·발견 목록은 무료로 남고, 끝내는 동작만 라이선스가 필요합니다.",
      again: "내려받기가 시작되지 않았나요", help: "문제 알리기", back: "홈으로"
    },
    en: {
      eyebrow: "Downloading", title: "You're all set",
      lede: "Your download starts in a moment. If it doesn't, use the link below.",
      s1: "Open the DMG and drag Paws into your Applications folder.",
      s2: "Launch Paws from Applications. A paw appears in the menu bar — no window opens.",
      s3: "Allow notifications and Paws speaks up only when memory gets tight. Otherwise it stays quiet.",
      note: "Everything is unlocked for 14 days. After that the ring, the graphs and the findings list stay free forever — only ending processes needs a license.",
      again: "Download didn't start?", help: "Report a problem", back: "Back to the site"
    },
    ja: {
      eyebrow: "ダウンロード中", title: "ダウンロードを開始しました",
      lede: "まもなく始まります。始まらない場合は下のリンクから。",
      s1: "DMG を開き、Paws を「アプリケーション」フォルダにドラッグします。",
      s2: "アプリケーションから Paws を開きます。メニューバーに肉球がひとつ出ます — ウインドウは開きません。",
      s3: "通知を許可すると、メモリが逼迫したときだけ知らせます。普段は静かです。",
      note: "インストール後 14 日間はすべて使えます。その後も監視・グラフ・検出一覧は無料のままで、終了する操作だけにライセンスが必要です。",
      again: "ダウンロードが始まらないとき", help: "問題を知らせる", back: "サイトへ戻る"
    },
    "zh-hans": {
      eyebrow: "正在下载", title: "下载已开始",
      lede: "稍候即会开始。如果没有开始，请点击下面的链接。",
      s1: "打开 DMG，把 Paws 拖进「应用程序」文件夹。",
      s2: "从应用程序打开 Paws。菜单栏会出现一个爪印 — 不会弹出窗口。",
      s3: "允许通知后，只有内存吃紧时它才出声。平时很安静。",
      note: "安装后 14 天内全部功能可用。之后监控、图表和发现列表依然免费，只有结束进程需要许可证。",
      again: "下载没有开始？", help: "反馈问题", back: "返回网站"
    },
    de: {
      eyebrow: "Wird geladen", title: "Der Download läuft",
      lede: "Er startet gleich. Falls nicht, nutze den Link unten.",
      s1: "Öffne das DMG und zieh Paws in den Programme-Ordner.",
      s2: "Starte Paws aus dem Programme-Ordner. In der Menüleiste erscheint eine Pfote — es öffnet sich kein Fenster.",
      s3: "Erlaube Mitteilungen, dann meldet sich Paws nur, wenn der Speicher knapp wird. Sonst bleibt es still.",
      note: "14 Tage lang ist alles freigeschaltet. Danach bleiben Ring, Diagramme und Fundliste dauerhaft kostenlos — eine Lizenz braucht nur das Beenden von Prozessen.",
      again: "Download nicht gestartet?", help: "Problem melden", back: "Zurück zur Seite"
    }
  };

  var q = new URLSearchParams(location.search);
  var lang = (q.get("lang") || "ko").toLowerCase();
  var t = T[lang] || T.ko;
  var file = (q.get("f") || "").replace(/[^A-Za-z0-9._-]/g, "");
  if (!/^Paws-[0-9.]+\.dmg$/.test(file)) file = "Paws-1.3.4.dmg";

  document.documentElement.lang = lang;
  document.title = "Paws — " + t.title;
  var set = function (id, text) { document.getElementById(id).textContent = text; };
  set("eyebrow", t.eyebrow); set("h1", t.title); set("lede", t.lede);
  set("s1", t.s1); set("s2", t.s2); set("s3", t.s3); set("note", t.note);
  set("again", t.again); set("help", t.help); set("back", t.back);

  var again = document.getElementById("again");
  again.href = file;
  again.setAttribute("download", "");
  document.getElementById("back").href = lang === "ko" ? "./" : lang + "/";

  /* 페이지가 그려진 뒤에 시작한다. 먼저 시작하면 사파리가 설치 안내를 읽기도 전에
     다운로드 표시줄로 시선을 끌어간다. */
  setTimeout(function () {
    var a = document.createElement("a");
    a.href = file; a.download = "";
    document.body.appendChild(a); a.click(); a.remove();
  }, 700);
})();
</script>
<script src="analytics.js" defer></script>
</body>
</html>
